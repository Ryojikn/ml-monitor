                $ref: '#/components/schemas/DriftResultRead'
            perf_timeline:
              type: array
              items:
                $ref: '#/components/schemas/PerformanceResultRead'
            quality_results:
              type: array
              items:
                $ref: '#/components/schemas/QualityResultRead'
            recent_runs:
              type: array
              items:
                $ref: '#/components/schemas/RunRead'
            active_alerts:
              type: array
              items:
                $ref: '#/components/schemas/AlertRead'
            datasets:
              type: array
              items:
                $ref: '#/components/schemas/DatasetRead'

    RunRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
        triggered_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, success, failed]
        engine:
          type: string
        duration_seconds:
          type: number
          nullable: true
        window_start:
          type: string
          nullable: true
        window_end:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true

    DriftResultRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
        feature_name:
          type: string
        date:
          type: string
        psi:
          type: number
          nullable: true
        ks_stat:
          type: number
          nullable: true
        ks_pvalue:
          type: number
          nullable: true
        jsd:
          type: number
          nullable: true
        wasserstein:
          type: number
          nullable: true
        chi2_stat:
          type: number
          nullable: true
        chi2_pvalue:
          type: number
          nullable: true
        is_drifted:
          type: boolean
        severity:
          type: string
          enum: [stable, warning, critical]
        baseline_histogram:
          type: object
          nullable: true
        current_histogram:
          type: object
          nullable: true

    PerformanceResultRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        date:
          type: string
        accuracy:
          type: number
          nullable: true
        f1_score:
          type: number
          nullable: true
        auc_roc:
          type: number
          nullable: true
        precision:
          type: number
          nullable: true
        recall:
          type: number
          nullable: true
        r2:
          type: number
          nullable: true
        mae:
          type: number
          nullable: true
        rmse:
          type: number
          nullable: true
        prediction_psi:
          type: number
          nullable: true

    QualityResultRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        feature_name:
          type: string
        date:
          type: string
        missing_rate:
          type: number
        outlier_rate:
          type: number
        null_count:
          type: integer
        total_count:
          type: integer

    DriftSummary:
      type: object
      properties:
        psi_timeline:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              psi:
                type: number
        features:
          type: array
          items:
            $ref: '#/components/schemas/DriftResultRead'

    FeatureHistogram:
      type: object
      properties:
        feature_name:
          type: string
        psi:
          type: number
        ks_stat:
          type: number
          nullable: true
        baseline_histogram:
          type: object
          properties:
            bins:
              type: array
              items:
                type: number
            counts:
              type: array
              items:
                type: integer
        current_histogram:
          type: object
          properties:
            bins:
              type: array
              items:
                type: number
            counts:
              type: array
              items:
                type: integer

    DatasetRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [baseline, production]
        filename:
          type: string
        row_count:
          type: integer
          nullable: true
        column_names:
          type: array
          items:
            type: string
          nullable: true
        uploaded_at:
          type: string
          format: date-time

    AssignedUserRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string

    AlertRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
          nullable: true
        severity:
          type: string
          enum: [CRITICAL, WARNING]
        metric_name:
          type: string
        metric_value:
          type: number
        threshold:
          type: number
        message:
          type: string
        status:
          type: string
          enum: [open, acknowledged, resolved]
        feature_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        assigned_to:
          type: string
          nullable: true
          description: Display name cache (denormalised)
        assigned_to_user_id:
          type: string
          format: uuid
          nullable: true
        assigned_user:
          $ref: '#/components/schemas/AssignedUserRead'
          nullable: true

    AlertUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, acknowledged, resolved]
          nullable: true
        assigned_to:
          type: string
          nullable: true
          description: Legacy display-name field (prefer assigned_to_user_id)
        assigned_to_user_id:
          type: string
          format: uuid
          nullable: true
          description: |
            When set, automatically acknowledges the alert, records acknowledged_at,
            and dispatches assignment notifications to all enabled channels.

    AlertListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertRead'
        total:
          type: integer

    StorageConnectionCreate:
      type: object
      required: [name, type, config]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [s3, gcs, sql, unity_catalog, kafka]
        description:
          type: string
        config:
          type: object
          description: Connection-type-specific credentials and settings

    StorageConnectionUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        config:
          type: object

    StorageConnectionRead:
      allOf:
        - $ref: '#/components/schemas/StorageConnectionCreate'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            last_tested_at:
              type: string
              format: date-time
              nullable: true
            last_test_ok:
              type: boolean
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    TestResult:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string

    BrowseResult:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum: [schema, table, view, bucket, folder, file]
              path:
                type: string
              selectable:
                type: string
                nullable: true
                description: Ready-to-use SELECT query or path string

    NotificationChannelCreate:
      type: object
      required: [type, name, config]
      properties:
        type:
          type: string
          enum: [slack, pagerduty, email, webhook]
        name:
          type: string
        enabled:
          type: boolean
          default: true
        config:
          type: object
          description: Channel-type-specific configuration

    NotificationChannelUpdate:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        config:
          type: object

    NotificationChannelRead:
      allOf:
        - $ref: '#/components/schemas/NotificationChannelCreate'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            last_tested_at:
              type: string
              format: date-time
              nullable: true
            last_test_ok:
              type: boolean
              nullable: true
            last_test_message:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: CI Pipeline

    ApiKeyRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: First 12 characters of the key (e.g. mlm_abc123)
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKeyRead'
        - type: object
          properties:
            full_key:
              type: string
              description: Complete API key — shown only once, store securely
              example: mlm_abc123def456ghi789jkl012mno345pqr678stu901vwx234

    TeamCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: ML Platform
        description:
          type: string
        external_id:
          type: string
        external_source:
          type: string
          enum: [okta, azure_ad, google, ldap]

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        external_id:
          type: string
        external_source:
          type: string

    TeamRead:
      allOf:
        - $ref: '#/components/schemas/TeamCreate'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
              description: URL-safe identifier auto-generated from name
            member_count:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    TeamWithMembers:
      allOf:
        - $ref: '#/components/schemas/TeamRead'
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/MembershipRead'

    MembershipCreate:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleType'

    MembershipUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/RoleType'

    MembershipRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleType'
        created_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserRead'

    RoleType:
      type: string
      enum: [can_review, can_edit, can_manage, can_admin]
      description: |
        - `can_review`: Read-only access
        - `can_edit`: Full CRUD on team models
        - `can_manage`: Edit + team member management
        - `can_admin`: All permissions + cross-team access

    SyncMember:
      type: object
      required: [email, role]
      properties:
        external_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/RoleType'

    TeamSyncRequest:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/SyncMember'

    UserCreate:
      type: object
      required: [email, display_name]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        external_id:
          type: string
        external_source:
          type: string
          enum: [okta, azure_ad, google, ldap]

    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
        is_active:
          type: boolean

    UserRead:
      allOf:
        - $ref: '#/components/schemas/UserCreate'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            is_active:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    UserWithTeams:
      allOf:
        - $ref: '#/components/schemas/UserRead'
        - type: object
          properties:
            memberships:
              type: array
              items:
                $ref: '#/components/schemas/MembershipRead'

    UserListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserWithTeams'
        total:
          type: integer
